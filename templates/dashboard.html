<script>
function runCleanup() {
    const statusBox = document.getElementById('status-box');
    statusBox.classList.remove('hidden');
    statusBox.textContent = 'Running cleanup... this may take a minute.';

    fetch('/run_cleanup', { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                statusBox.textContent = 'Error: ' + data.error;
                return;
            }
            statusBox.textContent = `Done! Deleted: ${data.deleted}, Kept: ${data.kept}`;
            document.getElementById('total-deleted').textContent = data.deleted;
            document.getElementById('total-kept').textContent = data.kept;
            document.getElementById('total-cleaned').textContent = data.deleted + data.kept;
            loadActivity();
        })
        .catch(err => {
            statusBox.textContent = 'Something went wrong. Try again.';
            console.error(err);
        });
}

function loadActivity() {
    fetch('/activity')
        .then(res => res.json())
        .then(data => {
            const list = document.getElementById('activity-list');
            if (!data.emails || data.emails.length === 0) {
                list.innerHTML = '<p class="text-indigo-300 text-sm">No activity yet. Run a cleanup to see results here.</p>';
                return;
            }
            window.activityData = data.emails;
            list.innerHTML = data.emails.map((e, index) => `
                <div class="flex items-center justify-between py-3 border-b border-white border-opacity-5 last:border-0">
                    <div class="flex-1 mr-4">
                        <p class="text-sm font-medium">${e.subject || 'No Subject'}</p>
                        <p class="text-xs text-indigo-300">${e.sender || 'Unknown'}</p>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-xs px-3 py-1 rounded-full ${e.label === 'Deleted' ? 'bg-red-500 bg-opacity-20 text-red-300' : 'bg-green-500 bg-opacity-20 text-green-300'}">
                            ${e.label}
                        </span>
                        <button onclick="sendFeedback(${index})"
                            class="text-xs bg-white bg-opacity-10 hover:bg-opacity-20 px-2 py-1 rounded-lg transition text-yellow-300">
                            ✗ Wrong
                        </button>
                    </div>
                </div>
            `).join('');
        });
}

function sendFeedback(index) {
    const e = window.activityData[index];
    fetch('/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            subject: e.subject,
            sender: e.sender,
            original_action: e.label.toLowerCase(),
            correct_action: e.label === 'Deleted' ? 'kept' : 'deleted'
        })
    })
    .then(res => res.json())
    .then(data => {
        if (data.retrained) {
            alert('Your personal model has been retrained and is now smarter!');
        } else {
            const needed = Math.max(0, 5 - data.feedback_count);
            if (needed > 0) {
                alert(`Feedback saved! ${needed} more corrections needed to train your personal model.`);
            } else {
                alert('Feedback saved! Your personal model is learning.');
            }
        }
    });
}

loadActivity();
</script>
