<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Agent - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
        .card-glow { box-shadow: 0 0 40px rgba(99, 102, 241, 0.15); }
        input:focus { outline: none; }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white">Reset Password</h1>
            <p class="text-indigo-300 mt-1 text-sm">We'll send you a reset link</p>
        </div>

        <div class="bg-white bg-opacity-5 backdrop-blur-sm border border-white border-opacity-10 rounded-2xl p-8 card-glow">
            {% if sent %}
            <div class="bg-green-500 bg-opacity-20 border border-green-500 border-opacity-30 text-green-300 px-4 py-3 rounded-xl text-sm text-center">
                If that email exists, a reset link has been sent. Check your inbox.
            </div>
            <p class="text-center text-indigo-300 text-sm mt-6">
                <a href="/login" class="text-white font-semibold hover:text-indigo-200 transition">Back to login</a>
            </p>
            {% else %}
            <form method="POST" class="space-y-4">
                <div>
                    <label class="text-indigo-200 text-sm font-medium block mb-2">Email address</label>
                    <input type="email" name="email" required
                        class="w-full bg-white bg-opacity-10 border border-white border-opacity-10 text-white placeholder-indigo-300 rounded-xl px-4 py-3 text-sm focus:border-indigo-500 transition"
                        placeholder="you@example.com">
                </div>
                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition duration-200">
                    Send Reset Link
                </button>
            </form>
            <p class="text-center text-indigo-300 text-sm mt-6">
                <a href="/login" class="text-white font-semibold hover:text-indigo-200 transition">Back to login</a>
            </p>
            {% endif %}
        </div>
    </div>
</body>
</html>
